<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<canvas id="staticGifCanvas"></canvas>

</body>
<script>
  const canvas = document.getElementById("staticGifCanvas");
  const ctx = canvas.getContext("2d");
  const img = new Image();

  // Point this to your animated GIF path
  img.src = "your-animation.gif";

  img.addEventListener("load", () => {
    // Match canvas dimensions to the image
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    // Drawing the GIF onto the canvas permanently freezes it on frame 1
    ctx.drawImage(img, 0, 0);
  });


</script>
</html>
